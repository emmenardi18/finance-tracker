<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08161d">
<title>Money</title>
<link rel="stylesheet" href="styles.css?v=4">
</head>
<body>
<div class="app">
<header class="top"><div><div class="logo">MONEY</div><div class="subtitle">Le tue finanze</div></div><button id="clearAll" class="ghost" type="button">Reset</button></header>
<main>
<section class="balance-card"><span>Saldo</span><strong id="balance">€ 0,00</strong><div class="balance-row"><div><small>Entrate</small><b id="income">€ 0,00</b></div><div><small>Uscite</small><b id="expense">€ 0,00</b></div></div></section>
<section class="quick"><div class="section-title">Aggiungi movimento</div><button id="openAdd" class="add-button" type="button"><span>＋</span><div><b>Aggiungi importo</b><small>Una spesa o un'entrata</small></div></button></section>
<section><div class="section-title">Ultimi movimenti</div><div id="transactions" class="transactions"></div></section>
</main></div>
<div id="modal" class="modal hidden"><div class="sheet">
<div class="sheet-head"><h2>Nuovo movimento</h2><button id="close" class="close" type="button">×</button></div>
<label class="field-label">Importo</label><div class="amount-wrap"><span>€</span><input id="amount" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0,00" autocomplete="off"></div>
<label class="field-label">Tipo</label><div class="slider-box"><div class="slider-labels"><span>Uscita</span><span>Entrata</span></div><input id="typeSlider" type="range" min="0" max="1" step="1" value="0"><div id="typeValue" class="slider-value expense">Uscita</div></div>
<label class="field-label">Categoria</label><div class="slider-box"><div class="slider-labels"><span>Svago</span><span>Viaggi</span></div><input id="categorySlider" type="range" min="0" max="4" step="1" value="0"><div id="categoryValue" class="slider-value">🎮 Svago</div></div>
<div class="category-dots" id="categoryDots"></div>
<input id="description" class="description" type="text" placeholder="Descrizione (opzionale)" autocomplete="off">
<button id="save" class="save" type="button">Aggiungi</button>
</div></div>
<script src="app.js?v=4"></script>
</body></html>
